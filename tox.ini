[tox]
envlist = 
    py{310,311,312,313,314,315}
    check-manifest
distshare = dist
skip_missing_interpreters = true

[testenv]
extras = 
    tests
    torch
wheel = true
skipsdist = true
passenv = *
commands = 
    pytest

[testenv:check-manifest]
skip_install = true
deps = check-manifest
commands = check-manifest
