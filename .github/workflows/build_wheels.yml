name: Build wheels

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build ${{ matrix.artifact }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: manylinux-x86_64-cp310-cp314
            build: "cp3{10,11,12,13,14}-*"
            test_extras: tests,torch
          - os: ubuntu-latest
            artifact: manylinux-x86_64-cp315
            build: "cp315-*"
            test_extras: tests
          - os: windows-latest
            artifact: win-amd64-cp310-cp314
            build: "cp3{10,11,12,13,14}-*"
            test_extras: tests,torch
          - os: windows-latest
            artifact: win-amd64-cp315
            build: "cp315-*"
            test_extras: tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.1

      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.build }}
          # Keep the supported platform set explicit even where CIBW_BUILD and
          # auto64 already exclude these identifiers: no 32-bit, musl, or
          # free-threaded wheels are part of this release.
          CIBW_SKIP: "*-win32 *-*linux_i686 *-musllinux_* cp3??t-*"
          CIBW_ARCHS: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # CI forces the pinned fallback dependency stack instead of accepting
          # a version-agnostic system pybind11 (possibly 3.x). These settings
          # are CI-only, so normal conda development builds retain discovery.
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.CMAKE_DISABLE_FIND_PACKAGE_pybind11=TRUE
            cmake.define.CMAKE_DISABLE_FIND_PACKAGE_xtensor=TRUE
            cmake.define.CMAKE_DISABLE_FIND_PACKAGE_xtensor-python=TRUE
          CIBW_ENVIRONMENT_WINDOWS: CC=clang CXX=clang++
          # PyPI has no torch wheel for CPython 3.15. That matrix slice installs
          # only the tests extra, and the suite's torch guards skip 15 tests;
          # CPython 3.10-3.14 install and exercise the torch extra normally.
          CIBW_TEST_EXTRAS: ${{ matrix.test_extras }}
          CIBW_TEST_COMMAND: "python -m pytest {project}/tests"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  upload_pypi:
    name: Publish wheels to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist
